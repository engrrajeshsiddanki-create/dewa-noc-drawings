<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteLedger UAE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail (project + modules) beside a scrolling work area; rail collapses to a top tab strip on phones. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f5f7f8; --sunk: #e4e9ec;
  --ink: #13202a; --ink-2: #44535f; --muted: #6f7d88; --line: #d5dde2; --line-2: #e6ebee;
  --accent: #0d5a73; --accent-ink: #ffffff; --accent-soft: #dcecf1; --sand: #a8731f; --sand-soft: #f6ead3;
  --good: #1d7f48; --good-soft: #dcf0e3; --warn: #a86a05; --warn-soft: #fbedd0; --crit: #c0392b; --crit-soft: #f8dedb;
  --s-pv: #2a78d6; --s-ev: #eb6834; --s-ac: #1baf7a; --s-bl: #b7c2ca;
  --paper: #ffffff; --paper-ink: #17222b;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px; --shadow: 0 1px 2px rgb(19 32 42 / 0.06), 0 2px 8px rgb(19 32 42 / 0.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1418; --surface: #151d23; --surface-2: #1a242b; --sunk: #0b1013;
  --ink: #e5ecf0; --ink-2: #a9b7c1; --muted: #7d8c97; --line: #2a3843; --line-2: #212d36;
  --accent: #5bb5d1; --accent-ink: #06222c; --accent-soft: #163745; --sand: #e0a94c; --sand-soft: #3a2e17;
  --good: #44c07a; --good-soft: #15321f; --warn: #e2a53b; --warn-soft: #3a2c10; --crit: #ef6b5b; --crit-soft: #3d1a17;
  --s-pv: #3987e5; --s-ev: #d95926; --s-ac: #199e70; --s-bl: #4a5a66;
  --paper: #f8fafb; --paper-ink: #17222b; color-scheme: dark; --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
} }
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #151d23; --surface-2: #1a242b; --sunk: #0b1013;
  --ink: #e5ecf0; --ink-2: #a9b7c1; --muted: #7d8c97; --line: #2a3843; --line-2: #212d36;
  --accent: #5bb5d1; --accent-ink: #06222c; --accent-soft: #163745; --sand: #e0a94c; --sand-soft: #3a2e17;
  --good: #44c07a; --good-soft: #15321f; --warn: #e2a53b; --warn-soft: #3a2c10; --crit: #ef6b5b; --crit-soft: #3d1a17;
  --s-pv: #3987e5; --s-ev: #d95926; --s-ac: #199e70; --s-bl: #4a5a66;
  --paper: #f8fafb; --paper-ink: #17222b; color-scheme: dark; --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: -0.04em; }
.brand b { font-family: var(--f-display); font-size: 16px; display: block; line-height: 1.1; }
.brand span { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.proj-card { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--surface-2); display: grid; gap: 4px; font-size: 12px; }
.proj-card b { font-size: 13px; line-height: 1.25; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.nav .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 20px; }
.rail-foot { margin-top: auto; font-size: 11px; color: var(--muted); display: grid; gap: 6px; }
.main { min-width: 0; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 24px; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.datechip { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
.datechip i { width: 8px; height: 8px; border-radius: 50%; background: var(--sand); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; flex-direction: row; align-items: center; gap: 10px; padding-block: 8px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  .brand span, .proj-card, .rail-foot { display: none; }
  .brand-mark { width: 30px; height: 30px; flex: none; }
  .brand b { display: none; }
  .nav { display: flex; gap: 2px; }
  .nav a { white-space: nowrap; padding: 7px 10px; font-size: 13px; }
  .nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  .nav .k { display: none; }
  .topbar h1 { font-size: 20px; }
}

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.panel-h h2 { font-size: 15px; }
.panel-h .sub { font-size: 12px; color: var(--muted); }
.panel-b { padding: 14px 16px; min-width: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g-main, .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1250px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.kpi .v { font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .d { font-size: 12px; color: var(--ink-2); }
.kpi.alert { border-color: var(--crit); }
.kpi.watch { border-color: var(--warn); }

/* chips & buttons */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.chip.sand { background: var(--sand-soft); color: var(--sand); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 600; min-width: 0; }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; font-size: 14px; font-weight: 400; color: var(--ink); min-width: 0; width: 100%; }
.inp.sm { padding: 3px 6px; font-size: 13px; }
.field textarea { resize: vertical; min-height: 70px; }
select.inp, .field select { cursor: pointer; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }

/* tables */
.tw { overflow-x: auto; min-width: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; z-index: 1; }
.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.t td.r, .t th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t tr.total td { font-weight: 700; border-top: 1px solid var(--line); background: var(--surface-2); }
.t tr.clickable { cursor: pointer; } .t tr.clickable:hover td { background: var(--surface-2); }
.t tr.sel td { background: var(--accent-soft); }
.desc { max-width: 420px; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; min-width: 60px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--s-ev); border-radius: 3px; }
.bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.scroll-y { max-height: 560px; overflow: auto; }

/* lifecycle */
.stage { border-bottom: 1px solid var(--line-2); }
.stage-row { display: grid; grid-template-columns: 34px minmax(0, 2.2fr) minmax(0, 1.2fr) 110px minmax(120px, 1fr) 90px; gap: 12px; align-items: center; padding: 10px 16px; cursor: pointer; }
.stage-row:hover { background: var(--surface-2); }
.stage-no { font-family: var(--f-mono); font-weight: 600; color: var(--accent); font-size: 13px; }
.stage-row h3 { font-size: 14px; }
.stage-row .sd { font-size: 12px; color: var(--muted); }
@media (max-width: 800px) { .stage-row { grid-template-columns: 30px minmax(0, 1fr) 96px; } .stage-row .hide-m { display: none; } }
.dual { display: grid; gap: 3px; }
.dual .bar > i.pv { background: var(--s-pv); }

/* gantt */
.gantt { overflow: auto; max-height: 640px; border-top: 1px solid var(--line-2); position: relative; }
.g-row { display: flex; min-width: max-content; border-bottom: 1px solid var(--line-2); }
.g-row.head { position: sticky; top: 0; z-index: 5; background: var(--surface); }
.g-left { position: sticky; left: 0; z-index: 3; background: var(--surface); display: grid; grid-template-columns: 70px 250px 40px 40px 40px 82px 82px 40px 44px; align-items: center; border-right: 1px solid var(--line); font-size: 12px; }
.g-row.head .g-left { z-index: 6; }
.g-left > div { padding: 5px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-left .r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.g-row.wbs { background: var(--surface-2); }
.g-row.wbs .g-left { background: var(--surface-2); font-weight: 700; }
.g-row.wbs .g-left > div:nth-child(2) { overflow: visible; }
.g-row.act { cursor: pointer; }
.g-row.act:hover .g-left, .g-row.act:hover .g-time { background: var(--accent-soft); }
.g-row.sel .g-left, .g-row.sel .g-time { background: var(--accent-soft); }
.g-time { position: relative; height: 26px; }
.g-row.head .g-time { height: 34px; }
.g-bar { position: absolute; top: 7px; height: 12px; border-radius: 2px; background: var(--accent); overflow: hidden; }
.g-bar.crit { background: var(--crit); }
.g-bar.done { background: var(--muted); }
.g-bar.loe { background: transparent; border: 1.5px dashed var(--muted); height: 10px; top: 8px; }
.g-bar > i { position: absolute; inset: 0 auto 0 0; background: rgb(0 0 0 / 0.35); }
.g-bl { position: absolute; top: 20px; height: 4px; background: var(--s-bl); border-radius: 1px; }
.g-ms { position: absolute; top: 7px; width: 12px; height: 12px; transform: rotate(45deg); background: var(--ink); margin-left: -6px; }
.g-ms.crit { background: var(--crit); }
.g-dd { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--sand); z-index: 2; pointer-events: none; }
.g-cf { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--crit); z-index: 2; opacity: 0.6; pointer-events: none; }
.g-mo { position: absolute; top: 0; height: 34px; border-left: 1px solid var(--line); font-size: 10.5px; padding: 3px 4px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.g-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-2); }
@media (max-width: 700px) { .g-left { grid-template-columns: 64px 170px 0 0 0 0 0 40px 0; } .g-left > .opt { padding: 0; visibility: hidden; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.legend i.ln { height: 2px; }

/* drop zone, pipeline */
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--surface-2); }
.drop.on { border-color: var(--accent); background: var(--accent-soft); }
.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pipe > div { border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; font-size: 12px; display: grid; gap: 3px; background: var(--surface); }
.pipe > div b { font-size: 12.5px; }
.pipe > div.ok { border-color: var(--good); }
.pipe > div.ok .st { color: var(--good); }
.pipe .st { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* report paper */
.paper { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); max-width: 960px; margin: 0 auto; width: 100%; overflow: hidden; }
.paper * { --ink: #17222b; --ink-2: #44535f; --muted: #6f7d88; --line: #d5dde2; --line-2: #e6ebee; --surface: #ffffff; --surface-2: #f3f6f7; --s-pv: #2a78d6; --s-ev: #eb6834; --s-ac: #1baf7a; --sunk: #e4e9ec; --crit: #c0392b; }
.paper .t th { background: #ffffff; position: static; }
.paper-h { background: #0d4a5e; color: #fff; padding: 18px 26px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
.paper-h h2 { font-size: 22px; }
.paper-h .pn { font-family: var(--f-mono); font-size: 12px; opacity: 0.85; }
.paper-b { padding: 18px 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.paper-b > * { min-width: 0; }
.paper-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; font-size: 12.5px; }
@media (max-width: 640px) { .paper-meta { grid-template-columns: minmax(0, 1fr); } .paper-b, .paper-h { padding-left: 16px; padding-right: 16px; } }
.paper-meta div { display: flex; gap: 8px; border-bottom: 1px dotted #d5dde2; padding: 3px 0; }
.paper-meta b { min-width: 120px; color: #44535f; font-weight: 600; }
.paper section h3 { font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #0d4a5e; border-bottom: 2px solid #0d4a5e; padding-bottom: 4px; margin-bottom: 8px; }
.pk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .pk { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pk div { border: 1px solid #d5dde2; border-radius: 4px; padding: 7px 10px; display: grid; }
.pk span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #6f7d88; }
.pk b { font-family: var(--f-mono); font-size: 15px; }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.photos figure { margin: 0; display: grid; gap: 4px; font-size: 11.5px; color: #44535f; }
.photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 3px; border: 1px solid #d5dde2; max-width: 100%; }
.paper p { margin: 0 0 8px; max-width: 75ch; }
.paper ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* misc */
.alerts { display: grid; gap: 8px; }
.alert-i { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px 8px 0; background: var(--surface); overflow: hidden; }
.alert-i > i { background: var(--warn); border-radius: 0 2px 2px 0; }
.alert-i.crit > i { background: var(--crit); }
.alert-i b { font-size: 13px; display: block; }
.alert-i span { font-size: 12.5px; color: var(--ink-2); }
.toast { position: fixed; z-index: 50; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: min(420px, calc(100vw - 36px)); box-shadow: 0 6px 24px rgb(0 0 0 / 0.25); }
.code { font-family: var(--f-mono); font-size: 11.5px; background: var(--sunk); border-radius: 6px; padding: 10px 12px; white-space: pre; overflow: auto; max-height: 360px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow); min-width: 170px; z-index: 4; }
.tip .tr { display: flex; justify-content: space-between; gap: 12px; }
.tip .sw { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; }
.sub-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line-2); padding: 0 12px; }
.sub-tabs button { border: 0; background: none; padding: 10px 10px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; }
.sub-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.diary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .diary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.qrow { display: grid; grid-template-columns: minmax(0, 3fr) 110px minmax(0, 1.2fr) 34px; gap: 8px; align-items: end; }
@media (max-width: 700px) { .qrow { grid-template-columns: minmax(0, 1fr) 90px; } .qrow .loc { grid-column: 1 / 2; } }
.note { font-size: 12px; color: var(--muted); }
.warnline { font-size: 12px; color: var(--warn); }
.arch { display: grid; gap: 10px; }
.arch-layer { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: stretch; }
@media (max-width: 700px) { .arch-layer { grid-template-columns: minmax(0, 1fr); } }
.arch-layer > b { font-family: var(--f-display); font-size: 13px; color: var(--accent); padding-top: 8px; }
.arch-boxes { display: flex; flex-wrap: wrap; gap: 8px; }
.arch-boxes span { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; }
.arch-boxes span em { display: block; font-style: normal; color: var(--muted); font-size: 11.5px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

#boot b{color:#c0392b;display:block;margin-bottom:6px}

// ───────────────────────── BOQ parser ─────────────────────────
const UNIT_MAP = { cum: 'm3', 'cu.m': 'm3', m3: 'm3', 'm³': 'm3', sqm: 'm2', 'sq.m': 'm2', m2: 'm2', 'm²': 'm2', lm: 'm', rm: 'm', m: 'm', 'l.m': 'm', no: 'nr', 'no.': 'nr', nos: 'nr', nr: 'nr', each: 'nr', ea: 'nr', set: 'set', t: 'ton', ton: 'ton', tons: 'ton', tonne: 'ton', kg: 'kg', ls: 'LS', 'l.s': 'LS', 'l.s.': 'LS', lump: 'LS', item: 'LS', sum: 'LS', ps: 'PS', 'p.s': 'PS', 'p.s.': 'PS', month: 'month', months: 'month', mth: 'month', day: 'day', days: 'day', wk: 'week', week: 'week' };
const normUnit = (u) => { const k = String(u || '').trim().toLowerCase(); return UNIT_MAP[k] || String(u || '').trim(); };
const toNum = (v) => { if (typeof v === 'number') return v; if (v == null) return NaN; const s = String(v).replace(/[, ]|AED|aed|Dhs\.?/g, '').trim(); if (s === '' || s === '-') return NaN; return Number(s); };

function detectHeader(rows) {
  const keys = { ref: /^(item|ref|s\.? ?no|no\.?|code)\b/i, desc: /desc|particular|work item/i, unit: /^unit|uom/i, qty: /qty|quant/i, rate: /rate|unit price/i, amount: /amount|total|value/i };
  let best = { score: 0, row: -1, map: null };
  for (let r = 0; r < Math.min(rows.length, 40); r++) {
    const row = rows[r] || []; const map = {}; let score = 0;
    row.forEach((cell, c) => {
      const s = String(cell ?? '').trim(); if (!s) return;
      for (const [k, re] of Object.entries(keys)) if (map[k] == null && re.test(s)) { map[k] = c; score++; break; }
    });
    if (score > best.score) best = { score, row: r, map };
  }
  return best.score >= 3 ? best : null;
}

function parseRows(rows, fileName = 'BOQ') {
  const log = []; const warnings = [];
  const head = detectHeader(rows);
  let map, start;
  if (head) { map = head.map; start = head.row + 1; log.push(`Header found on row ${head.row + 1}: ` + Object.entries(map).map(([k, v]) => `${k}→col ${String.fromCharCode(65 + v)}`).join(', ')); }
  else { map = { ref: 0, desc: 1, unit: 2, qty: 3, rate: 4, amount: 5 }; start = 0; warnings.push('No header row detected; assumed columns A–F = Item, Description, Unit, Qty, Rate, Amount.'); }
  if (map.desc == null) { map.desc = 1; }
  const items = []; const divisions = []; let division = 'General'; const refs = new Set(); let skipped = 0;
  for (let r = start; r < rows.length; r++) {
    const row = rows[r] || [];
    const desc = String(row[map.desc] ?? '').trim();
    const ref = map.ref != null ? String(row[map.ref] ?? '').trim() : '';
    const qty = toNum(row[map.qty]); const rate = toNum(row[map.rate]); const amtRead = map.amount != null ? toNum(row[map.amount]) : NaN;
    if (!desc && !ref) continue;
    if (/(^|\b)(sub-?total|total|carried|collection|brought forward|grand)/i.test(desc) && !(qty > 0 && rate > 0)) { skipped++; continue; }
    const isHeading = (!(qty > 0) && !(rate > 0) && !(amtRead > 0)) || /^bill\s*(no\.?)?\s*\d+/i.test(desc) && !(qty > 0);
    if (isHeading) { division = desc.replace(/\s+/g, ' ').replace(/^bill\s*no\.?\s*(\d+)\s*[—–:-]\s*/i, 'Bill $1 – '); divisions.push(division); continue; }
    let unit = normUnit(row[map.unit]);
    let q = qty, rt = rate;
    if (!(q > 0) && amtRead > 0) { q = 1; rt = amtRead; if (!unit) unit = 'LS'; }
    if (!(rt > 0) && amtRead > 0 && q > 0) rt = amtRead / q;
    if (!(q > 0) || !(rt > 0)) { warnings.push(`Row ${r + 1} (${ref || desc.slice(0, 30)}): missing quantity or rate, skipped.`); skipped++; continue; }
    const amount = round(q * rt, 2);
    if (amtRead > 0 && Math.abs(amtRead - amount) / amount > 0.01) warnings.push(`Item ${ref || r + 1}: printed amount AED ${AED(amtRead)} ≠ qty × rate AED ${AED(amount)}. Recalculated.`);
    let finalRef = ref || `R${r + 1}`; if (refs.has(finalRef)) { warnings.push(`Duplicate item ref ${finalRef}; renamed ${finalRef}-b.`); finalRef += '-b'; }
    refs.add(finalRef);
    const ps = unit === 'PS' || /provisional sum/i.test(desc);
    items.push({ id: 'i' + items.length, ref: finalRef, desc, unit: unit || 'LS', qty: q, rate: round(rt, 2), amount, division, ps, row: r + 1 });
  }
  if (!divisions.length) divisions.push('General');
  log.push(`${items.length} priced line items extracted across ${divisions.length} bills/divisions; ${skipped} heading/total rows skipped.`);
  items.forEach((it) => { it.cls = classify(it.desc, it.division); });
  return { fileName, items, divisions, warnings, log, columnMap: map };
}

// Line-based extraction for text pulled out of PDFs
function parsePdfLines(lines) {
  const rows = [['Item', 'Description', 'Unit', 'Qty', 'Rate', 'Amount']];
  const unitRe = '(m3|m³|cum|m2|m²|sqm|m|lm|rm|nr|no\\.?|nos|ton|t|kg|ls|l\\.s\\.?|item|sum|ps|p\\.s\\.?|month|set|day)';
  const re = new RegExp(`^\\s*([A-Z]?\\d+(?:\\.\\d+)*[a-z]?)?\\s+(.+?)\\s+${unitRe}\\s+([\\d,]+(?:\\.\\d+)?)\\s+([\\d,]+(?:\\.\\d+)?)(?:\\s+([\\d,]+(?:\\.\\d+)?))?\\s*$`, 'i');
  for (const line of lines) {
    const m = line.match(re);
    if (m) rows.push([m[1] || '', m[2], m[3], m[4], m[5], m[6] || '']);
    else if (/^\s*(bill|section|division|part)\b/i.test(line) || /^[A-Z][A-Z &,'/-]{6,}$/.test(line.trim())) rows.push(['', line.trim()]);
  }
  return rows;
}

function buildCalendar(startISO, cal, horizon = 1600) {
  const s0 = parseISO(startISO); const PRE = 500; const N = PRE + horizon;
  const hol = new Map(cal.holidays ? UAE_HOLIDAYS : []);
  const ram = RAMADAN.map(([a, b]) => [parseISO(a), parseISO(b)]);
  const work = new Uint8Array(N), capIn = new Float32Array(N), capOut = new Float32Array(N), pref = new Int32Array(N + 1);
  const flags = new Array(N);
  for (let i = 0; i < N; i++) {
    const ms = s0 + (i - PRE) * DAY; const d = new Date(ms); const dow = d.getUTCDay(); const key = iso(ms);
    const md = (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
    const isOff = cal.offDays.includes(dow); const holName = hol.get(key);
    const inRam = cal.ramadan && ram.some(([a, b]) => ms >= a && ms <= b);
    const inSummer = cal.summer && md >= 615 && md <= 915;
    const w = !isOff && !holName; work[i] = w ? 1 : 0;
    const rf = inRam ? cal.ramadanFactor : 1; const sf = inSummer ? cal.summerFactor : 1;
    capIn[i] = w ? rf : 0; capOut[i] = w ? rf * sf : 0;
    flags[i] = { holName, inRam, inSummer, isOff };
    pref[i + 1] = pref[i] + work[i];
  }
  const ix = (d) => clamp(d + PRE, 0, N - 1);
  const C = {
    startISO, s0, PRE, N,
    isWork: (d) => work[ix(d)] === 1,
    cap: (d, cls) => (cls === 'out' ? capOut : capIn)[ix(d)],
    info: (d) => flags[ix(d)],
    nextWork(d) { let x = d; while (!work[ix(x)] && x < horizon) x++; return x; },
    prevWork(d) { let x = d; while (!work[ix(x)] && x > -PRE) x--; return x; },
    fwd(d, k) { let x = d; let n = k; while (n > 0) { x++; if (work[ix(x)]) n--; } return x; },
    back(d, k) { let x = d; let n = k; while (n > 0) { x--; if (work[ix(x)]) n--; } return x; },
    addWork(es, dur, cls) { if (dur <= 0) return es; let acc = 0, x = es; const arr = cls === 'out' ? capOut : capIn; for (let g = 0; g < 5000; g++) { acc += arr[ix(x)]; if (acc >= dur - 1e-6) return x; x++; } return x; },
    subWork(lf, dur, cls) { if (dur <= 0) return lf; let acc = 0, x = lf; const arr = cls === 'out' ? capOut : capIn; for (let g = 0; g < 5000; g++) { acc += arr[ix(x)]; if (acc >= dur - 1e-6) return x; x--; } return x; },
    wd: (a, b) => pref[ix(b) + 1] - pref[ix(a) + 1], // working days in (a, b]
    date: (d) => s0 + d * DAY,
    dayOf: (ms) => Math.round((ms - s0) / DAY),
    iso: (d) => iso(s0 + d * DAY),
    fmt: (d) => fmtDate(s0 + d * DAY),
    summary(fromD, toD) { let w = 0, h = 0, r = 0, s = 0; for (let d = fromD; d <= toD; d++) { const f = flags[ix(d)]; if (work[ix(d)]) w++; if (f.holName) h++; if (f.inRam && work[ix(d)]) r++; if (f.inSummer && work[ix(d)]) s++; } return { work: w, holidays: h, ramadan: r, summer: s }; },
  };
  return C;
}

function generateSchedule(items, settings, project) {

  const groupDur = (g) => {

    for (const it of g.items) { const r = itemDur(it, g.key); if (r.d > best.d) best = r; }
    if (!g.items.length || best.d === 0) best = { d: fixed[g.key] ?? 20, basis: `Fixed ${fixed[g.key] ?? 20} d` };

  if (has('backfill')) L(pick('found', 'excav', afterSurvey), 'backfill', 'FS', 7);
  const subEnd = pick('found', 'excav', 'piling', afterSurvey);
  if (chain.frame) chain.frame.forEach((a, k) => L(k === 0 ? subEnd : chain.frame[k - 1].key, a.key));

  if (has('roofwp')) L(pick(ck('frame', 'last'), subEnd), 'roofwp', 'FS', 14);

  for (const a of acts) if (a.key !== 'ntp' && !predCount.get(a.key) && a.type !== 'TT_LOE') L('ntp', a.key);

  // integer, positive durations for tasks

  const seen = new Set(); const relsU = rels.filter((r) => { if (!r.from || !r.to || r.from === r.to || !byKey.has(r.from) || !byKey.has(r.to)) return false; const k = `${r.from}>${r.to}>${r.type}`; if (seen.has(k)) return false; seen.add(k); return true; });

}

// ───────────────────────── CPM (forward / backward pass) ─────────────────────────
function topoOrder(acts, byKey) {
  const indeg = new Map(acts.map((a) => [a.key, 0]));
  acts.forEach((a) => a.preds.forEach(() => indeg.set(a.key, indeg.get(a.key) + 1)));
  const q = acts.filter((a) => indeg.get(a.key) === 0).map((a) => a.key); const out = [];
  while (q.length) { const k = q.shift(); out.push(byKey.get(k)); for (const r of byKey.get(k).succs) { indeg.set(r.to, indeg.get(r.to) - 1); if (indeg.get(r.to) === 0) q.push(r.to); } }
  if (out.length !== acts.length) throw new Error('Logic loop detected in schedule network');
  return out;
}

/* progress: Map key → {pct, as, af, rd}  (only for the current/updated schedule)
   dataDay: data date (day index); finishBy: contract completion day index */
function cpm(net, cal, { dataDay = null, progress = null, finishBy }) {
  const { acts, byKey } = net; const order = topoOrder(acts, byKey);
  const R = new Map();
  const startFloor = dataDay == null ? 0 : cal.nextWork(dataDay + 1);
  for (const a of order) {
    const p = progress ? progress.get(a.key) : null;
    if (a.type === 'TT_LOE') continue;
    if (p && p.af != null) { R.set(a.key, { es: p.as, ef: p.af, done: true }); continue; }
    let es = 0, efMin = -Infinity;
    for (const r of a.preds) {
      const pr = R.get(r.from); if (!pr) continue; const pa = byKey.get(r.from); const pz = pa.type !== 'TT_Task';
      if (r.type === 'FS') es = Math.max(es, pz ? cal.fwd(pr.ef, r.lag) : cal.fwd(pr.ef, 1 + r.lag));
      else if (r.type === 'SS') es = Math.max(es, cal.fwd(pr.es, r.lag));
      else if (r.type === 'FF') efMin = Math.max(efMin, cal.fwd(pr.ef, r.lag));
    }
    if (p && p.as != null) {
      // in progress: remaining duration from data date (progress override)
      const ef = a.dur === 0 ? startFloor : cal.addWork(startFloor, p.rd, a.cls);
      R.set(a.key, { es: p.as, ef: Math.max(ef, p.as), inProg: true }); continue;
    }
    if (dataDay != null) es = Math.max(es, startFloor);
    if (a.type === 'TT_Task') es = cal.nextWork(es);
    let ef = a.type === 'TT_Task' ? cal.addWork(es, a.dur, a.cls) : es;
    if (efMin > ef) { ef = cal.prevWork(efMin); es = cal.subWork(ef, a.dur, a.cls); }
    R.set(a.key, { es, ef });
  }
  // backward pass
  const projLF = cal.prevWork(finishBy);
  for (const a of [...order].reverse()) {
    if (a.type === 'TT_LOE') continue;
    const me = R.get(a.key); const isZ = a.type !== 'TT_Task';
    let lf = a.key === 'dlp' || a.key === 'dlp_end' ? Math.max(projLF, me.ef) : projLF; let lsLim = Infinity;
    if (a.key === 'dlp' || a.key === 'dlp_end') { me.lf = me.ef; me.ls = me.es; me.tf = null; continue; }
    for (const r of a.succs) {
      const s = R.get(r.to); const sa = byKey.get(r.to); if (!s || sa.type === 'TT_LOE' || s.ls == null) continue;
      if (r.to === 'dlp') continue;
      if (r.type === 'FS') lf = Math.min(lf, isZ ? cal.back(s.ls, r.lag) : cal.back(s.ls, 1 + r.lag));
      else if (r.type === 'SS') lsLim = Math.min(lsLim, cal.back(s.ls, r.lag));
      else if (r.type === 'FF') lf = Math.min(lf, cal.back(s.lf, r.lag));
    }
    if (me.done) { me.ls = me.es; me.lf = me.ef; me.tf = null; continue; }
    if (a.type === 'TT_Task') lf = cal.prevWork(lf);
    const remDur = me.inProg ? Math.max(0, cal.wd(cal.prevWork(startFloor - 1), me.ef)) : a.dur;
    let ls = a.type === 'TT_Task' ? cal.subWork(lf, me.inProg ? remDur : a.dur, a.cls) : lf;
    if (!me.inProg && lsLim < ls) { ls = lsLim; lf = a.type === 'TT_Task' ? cal.addWork(ls, me.inProg ? remDur : a.dur, a.cls) : ls; }
    me.ls = me.inProg ? me.es : ls; me.lf = lf;
    me.tf = cal.wd(me.ef, lf) - (lf < me.ef ? 0 : 0);
    if (lf < me.ef) me.tf = -cal.wd(lf, me.ef);
  }
  // LOE spans
  for (const a of acts) if (a.type === 'TT_LOE') {
    const s = a.preds.filter((r) => r.type === 'SS').map((r) => R.get(r.from).es); const f = a.preds.filter((r) => r.type === 'FF').map((r) => R.get(r.from).ef);
    const es = Math.min(...s), ef = Math.max(...f); R.set(a.key, { es, ef, ls: es, lf: ef, tf: null, loe: true, done: progress ? ef <= dataDay : false });
  }
  const tfs = [...R.entries()].filter(([k, v]) => v.tf != null && !v.done && !v.loe).map(([, v]) => v.tf);
  const minTF = tfs.length ? Math.min(...tfs) : 0;
  for (const [k, v] of R) { v.critical = v.tf != null && !v.done && (v.tf <= Math.max(0, minTF)); v.nearCritical = v.tf != null && !v.done && !v.critical && v.tf <= Math.max(0, minTF) + 10; }
  // longest path: walk back from completion through driving predecessors
  const longest = new Set(); const walk = (k) => { if (longest.has(k)) return; longest.add(k); const a = byKey.get(k); const me = R.get(k); for (const r of a.preds) { const p = R.get(r.from); const pa = byKey.get(r.from); if (!p || pa.type === 'TT_LOE' || p.done) continue; const pz = pa.type !== 'TT_Task'; let drives = false; if (r.type === 'FS') drives = (pz ? cal.fwd(p.ef, r.lag) : cal.fwd(p.ef, 1 + r.lag)) >= me.es - 0 && cal.wd(pz ? cal.fwd(p.ef, r.lag) : cal.fwd(p.ef, 1 + r.lag), me.es) <= 0; else if (r.type === 'SS') drives = cal.wd(cal.fwd(p.es, r.lag), me.es) <= 0; else if (r.type === 'FF') drives = cal.wd(cal.fwd(p.ef, r.lag), me.ef) <= 0; if (drives) walk(r.from); } };
  if (R.has('completion')) walk('completion');
  for (const [k, v] of R) v.longest = longest.has(k) && !v.done;
  return { R, minTF, finish: R.get('completion') ? R.get('completion').ef : null };
}

// ───────────────────────── planned / earned value per item ─────────────────────────
function actFrac(cal, r, d) { if (!r) return 0; if (d < r.es) return 0; if (d >= r.ef) return 1; const tot = cal.wd(r.es - 1, r.ef); if (tot <= 0) return d >= r.ef ? 1 : 0; return clamp(cal.wd(r.es - 1, d) / tot, 0, 1); }

const PERF = { 1: 1, 2: 0.98, 3: 1, 4: 0.975, 5: 0.958, 6: 0.945, 7: 0.94, 8: 0.95, 9: 0.95, 10: 0.95, 11: 0.95, 12: 0.95, 13: 0.95, 14: 0.95, 15: 1, 16: 1 };
const COSTF = { 4: 1.03, 5: 1.06, 6: 0.97, 7: 1.02, 16: 1.045, 2: 1.0, 3: 1.04 };

function buildModel(state) {
  const { project, boq, settings } = state;
  const items = boq.items.map((it) => ({ ...it, c: applyStageOverride(it) }));
  const itemById = new Map(items.map((i) => [i.id, i]));
  const cal = buildCalendar(project.startDate, settings.cal);
  const contractEndMs = addMonthsISO(project.startDate, project.durationMonths) - DAY;
  const finishBy = cal.dayOf(contractEndMs);
  const dataDay = cal.dayOf(parseISO(project.dataDate));

  // Baseline network uses the baseline settings snapshot (re-baseline updates it)
  const blSettings = state.baselineSettings || settings;
  const blCal = buildCalendar(project.startDate, blSettings.cal);
  const blNet = generateSchedule(boq.items, blSettings, project);

        let best = null; for (const sn of wb.SheetNames) { const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }); const p = E.parseRows(rows, name); p.sheet = sn; if (!best || p.items.length > best.items.length) best = p; }
        if (!best || !best.items.length) throw new Error('No priced line items found. The sheet needs Description, Unit, Qty and Rate columns.');
        best.log.unshift(`Workbook "${name}": ${wb.SheetNames.length} sheet(s); used "${best.sheet}".`); apply(best, 'upload');
      } else if (ext === 'pdf') {
        setBusy('Extracting text from PDF…'); const used = await loadScript(LIBS.pdfjs); window.pdfjsLib.GlobalWorkerOptions.workerSrc = used && used.startsWith('lib/') ? PDF_WORKER[0] : PDF_WORKER[1];
        const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; const lines = [];
        for (let p = 1; p <= doc.numPages; p++) { const tc = await (await doc.getPage(p)).getTextContent(); const rows = new Map(); tc.items.forEach((it) => { const yk = Math.round(it.transform[5] / 3); if (!rows.has(yk)) rows.set(yk, []); rows.get(yk).push({ x: it.transform[4], s: it.str }); }); [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, arr]) => lines.push(arr.sort((a, b) => a.x - b.x).map((q) => q.s).join(' ').replace(/\s+/g, ' ').trim())); }
        const parsed = E.parseRows(E.parsePdfLines(lines), name); parsed.log.unshift(`PDF "${name}": ${doc.numPages} page(s), ${lines.length} text lines read.`);
        if (!parsed.items.length) throw new Error('No BOQ rows recognised in this PDF. Scanned PDFs need OCR; export the BOQ to Excel if you can.');
        apply(parsed, 'upload');

    } catch (e) { toast(e.message || String(e)); } finally { setBusy(''); }
  };
  const downloadSample = async () => { try { await loadScript(LIBS.xlsx); const ws = XLSX.utils.aoa_to_sheet(E.SAMPLE_BOQ.map((r) => r.slice(0, 6))); const rowsN = E.SAMPLE_BOQ.length; for (let r = 0; r < rowsN; r++) { const row = E.SAMPLE_BOQ[r]; if (row.length >= 5 && typeof row[3] === 'number') ws[XLSX.utils.encode_cell({ r, c: 5 })] = { t: 'n', f: `D${r + 1}*E${r + 1}` }; } ws['!cols'] = [{ wch: 7 }, { wch: 78 }, { wch: 7 }, { wch: 9 }, { wch: 12 }, { wch: 14 }]; const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'BOQ'); const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' }); const r = await saveFile('Sample_BOQ_AlFurjan_G+4.xlsx', new Blob([out])); toast(r.msg); } catch (e) { toast(e.message); } };
  const setStage = (id, st) => setState((s) => ({ ...s, boq: { ...s.boq, items: s.boq.items.map((it) => (it.id === id ? { ...it, stageOverride: st === it.cls.stage ? undefined : st, overrideSource: 'User' } : it)) } }));
  const lowConf = m.items.filter((i) => i.c.conf < 0.7);

    try { const res = await sample.json(prompt, { modelTier: 'quick' }); const map = new Map((Array.isArray(res) ? res : []).map((r) => [String(r.ref), r])); let n = 0; setState((s) => ({ ...s, boq: { ...s.boq, items: s.boq.items.map((it) => { const r = map.get(it.ref); if (r && r.stage >= 1 && r.stage <= 16) { n++; return { ...it, stageOverride: Number(r.stage), overrideSource: 'Claude', aiReason: r.reason }; } return it; }) } })); toast(`Claude mapped ${map.size} item(s). Review them in the table.`); setAi('ready'); }
    catch (e) { setAi('ready'); toast(e && e.code === 'not_granted' ? 'Claude access was declined for this page.' : `Claude could not map the items (${(e && e.code) || 'error'}).`); }
  };
  const rows = m.items.filter((i) => (stageF === 'all' || String(i.c.stage) === stageF) && (!filter || (i.ref + ' ' + i.desc + ' ' + i.division).toLowerCase().includes(filter.toLowerCase())));
  const steps = [['Read file', boq.fileName], ['Detect header', boq.columnMap ? Object.keys(boq.columnMap).length + ' columns mapped' : '—'], ['Extract items', `${boq.items.length} items · ${boq.divisions.length} bills`], ['Validate', `${boq.warnings.length} warning(s)`], ['Classify to 16 stages', `${m.items.filter((i) => i.c.conf >= 0.7).length} rule · ${lowConf.length} low`], ['Generate project', `${m.acts.length} activities · ${m.docs.subs.length} submittals`]];

        <dl class="kv">

        ${ai !== 'off' && html`<button class="btn sm" disabled=${ai === 'busy'} onClick=${askClaude} title="Sends the low-confidence item descriptions to Claude for stage mapping">${ai === 'busy' ? 'Asking Claude…' : `Ask Claude to map ${lowConf.length} low-confidence item${lowConf.length === 1 ? '' : 's'}`}</button>`}`}>
      <div class="tw scroll-y"><table class="t"><thead><tr><th>Ref</th><th>Description</th><th>Bill / division</th><th>Unit</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount AED</th><th>Lifecycle stage</th><th>Mapped by</th><th>Generated docs</th></tr></thead><tbody>

// ───────────────────────── lifecycle & budget tracker ─────────────────────────
function LifecycleView({ m }) {
  const [open, setOpen] = useState(() => new Set([5]));
  const toggle = (n) => setOpen((s) => { const x = new Set(s); x.has(n) ? x.delete(n) : x.add(n); return x; });
  const d = m.dataDay; const cal = m.cal;
  return html`<${Panel} pad=${false} title="Master lifecycle, quantities & budget tracker" sub=${`Budgeted vs executed vs remaining quantity, and budget vs earned vs actual cost, at data date ${fmtDate(cal.date(d))}. Click a stage to expand its BOQ items.`}>
    <div class="stage-row" style=${{ cursor: 'default', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--muted)', fontWeight: 600 }}><span>#</span><span>Stage</span><span class="hide-m">Baseline window (P6)</span><span class="hide-m" style=${{ textAlign: 'right' }}>Budget AED</span><span class="hide-m">Earned / planned</span><span style=${{ textAlign: 'right' }}>CPI</span></div>
    ${STAGES.map((st) => {
      const its = m.items.filter((i) => i.c.stage === st.no && !i.c.reserve); const acts = m.acts.filter((a) => a.wbs === st.no && a.bl.es != null);
      const bud = sum(its, (i) => i.amount); const pv = m.pvAt(d, (i) => i.c.stage === st.no && !i.c.reserve); const ev = m.evAt(d, (i) => i.c.stage === st.no && !i.c.reserve); const ac = m.acAt(d, (i) => i.c.stage === st.no && !i.c.reserve);
      const s = acts.length ? Math.min(...acts.map((a) => a.bl.es)) : null; const e = acts.length ? Math.max(...acts.map((a) => a.bl.ef)) : null;
      const isOpen = open.has(st.no);
      return html`<div class="stage" key=${st.no}>
        <div class="stage-row" onClick=${() => toggle(st.no)} role="button" aria-expanded=${isOpen} tabindex="0" onKeyDown=${(ev2) => (ev2.key === 'Enter' || ev2.key === ' ') && (ev2.preventDefault(), toggle(st.no))}>
          <span class="stage-no">${String(st.no).padStart(2, '0')}</span>
          <div><h3>${st.name} <span class="muted" style=${{ fontWeight: 400, fontSize: '12px' }}>${isOpen ? '▾' : '▸'} ${its.length} items · ${acts.length} activities</span></h3><div class="sd">${st.desc}</div></div>
          <span class="hide-m mono" style=${{ fontSize: '12px' }}>${s != null ? `${cal.fmt(s)} → ${cal.fmt(e)}` : '—'}</span>
          <span class="hide-m num" style=${{ textAlign: 'right' }}>${bud ? AED(bud) : '—'}</span>
          <div class="hide-m dual">${bud ? html`<${Bar} value=${ev / bud} marker=${pv / bud} /><span class="note">${pct(ev / bud, 0)} earned · ${pct(pv / bud, 0)} planned</span>` : html`<span class="note">Management / authority activities</span>`}</div>
          <span class="num" style=${{ textAlign: 'right', color: ac && ev / ac < 0.97 ? 'var(--crit)' : 'inherit' }}>${ac ? (ev / ac).toFixed(2) : '—'}</span>
        </div>
        ${isOpen && its.length > 0 && html`<div class="tw" style=${{ padding: '0 16px 14px' }}><table class="t"><thead><tr><th>Ref</th><th>Description</th><th>Unit</th><th class="r">BOQ qty</th><th class="r">Executed</th><th class="r">Remaining</th><th style=${{ minWidth: '110px' }}>Progress</th><th class="r">Budget AED</th><th class="r">Earned (EV)</th><th class="r">Actual (AC)</th><th class="r">CV</th><th class="r">Planned (PV)</th></tr></thead><tbody>
          ${its.map((it) => { const q = m.execQtyAt(it, d); const evv = Math.min(q, it.qty * 1.5) * it.rate; const acv = m.acAt(d, (x) => x.id === it.id); const pvv = it.amount * m.plannedFrac(it, d); const dp = it.unit === 'LS' || it.unit === 'PS' || it.unit === 'month' ? 2 : 0;
            return html`<tr key=${it.id}><td class="mono">${it.ref}</td><td class="desc">${it.desc}</td><td>${it.unit}</td><td class="r">${AED(it.qty, dp)}</td><td class="r">${AED(q, dp)}</td><td class="r">${AED(Math.max(0, it.qty - q), dp)}</td><td><${Bar} value=${q / it.qty} marker=${m.plannedFrac(it, d)} /></td><td class="r">${AED(it.amount)}</td><td class="r">${AED(evv)}</td><td class="r">${AED(acv)}</td><td class="r" style=${{ color: evv - acv < 0 ? 'var(--crit)' : 'inherit' }}>${AED(evv - acv)}</td><td class="r">${AED(pvv)}</td></tr>`; })}

      </div>`;
    })}
  <//>`;
}

// ───────────────────────── P6 programme ─────────────────────────
function Gantt({ m, rows, zoom, showBL, sel, onSel }) {
  const cal = m.cal; const px = zoom === 'week' ? 7 : zoom === 'quarter' ? 1.1 : 2.6;
  const dated = rows.filter((r) => r.a && r.a.cur.es != null);
  const minD = Math.min(0, ...dated.map((r) => Math.min(r.a.cur.es, r.a.bl.es ?? Infinity))) - 7;
  const maxD = Math.max(m.finishBy, ...dated.filter((r) => r.a.wbs !== 15).map((r) => Math.max(r.a.cur.ef, r.a.bl.ef ?? 0))) + 30;
  const W = (maxD - minD) * px; const X = (d) => (d - minD) * px;
  const months = []; { const s = new Date(cal.date(minD)); let k = 0; for (;;) { const ms = Date.UTC(s.getUTCFullYear(), s.getUTCMonth() + k, 1); const d = cal.dayOf(ms); if (d > maxD) break; if (d >= minD) months.push({ d, label: `${E.MONTHS[new Date(ms).getUTCMonth()]} ${String(new Date(ms).getUTCFullYear()).slice(2)}` }); k++; } }
  return html`<div class="gantt">
    <div class="g-row head"><div class="g-left" style=${{ fontWeight: 600, color: 'var(--muted)', fontSize: '10.5px', textTransform: 'uppercase' }}><div>Activity ID</div><div>Activity name</div><div class="r opt">OD</div><div class="r opt">RD</div><div class="r opt">%</div><div class="opt">Start</div><div class="opt">Finish</div><div class="r">TF</div><div class="r opt">FV</div></div>
      <div class="g-time" style=${{ width: W + 'px' }}>${months.map((mo) => html`<div key=${mo.d} class="g-mo" style=${{ left: X(mo.d) + 'px', width: (zoom === 'quarter' ? 34 : 31 * px) + 'px' }}>${zoom === 'quarter' && new Date(cal.date(mo.d)).getUTCMonth() % 3 ? '' : mo.label}</div>`)}</div></div>
    ${rows.map((r) => {
      if (r.wbs) return html`<div key=${'w' + r.wbs.no} class="g-row wbs"><div class="g-left"><div class="mono">${String(r.wbs.no).padStart(2, '0')}.${r.wbs.code}</div><div>${r.wbs.name}</div><div class="opt"></div><div class="opt"></div><div class="opt"></div><div class="opt"></div><div class="opt"></div><div></div><div class="opt"></div></div><div class="g-time" style=${{ width: W + 'px' }}><div class="g-dd" style=${{ left: X(m.dataDay) + 'px' }}></div></div></div>`;
      const a = r.a; const c = a.cur; const b = a.bl; const isMs = a.type === 'TT_Mile' || a.type === 'TT_FinMile'; const crit = c.critical && a.status !== 'Completed';
      const cls = 'g-bar' + (a.type === 'TT_LOE' ? ' loe' : a.status === 'Completed' ? ' done' : crit ? ' crit' : '');
      return html`<div key=${a.key} class=${'g-row act' + (sel === a.key ? ' sel' : '')} onClick=${() => onSel(a.key)} title=${a.name}>
        <div class="g-left"><div class="mono">${a.code}</div><div>${a.name}</div><div class="r opt">${a.type === 'TT_Task' ? a.blDur : ''}</div><div class="r opt">${a.type === 'TT_Task' ? a.rd : ''}</div><div class="r opt">${a.type === 'TT_LOE' ? '' : Math.round(a.pct * 100)}</div><div class="opt mono">${c.es != null ? cal.fmt(c.es) : ''}${a.as != null ? ' A' : ''}</div><div class="opt mono">${c.ef != null ? cal.fmt(c.ef) : ''}${a.af != null ? ' A' : ''}</div><div class="r" style=${{ color: c.tf != null && c.tf < 0 ? 'var(--crit)' : 'inherit', fontWeight: crit ? 700 : 400 }}>${c.tf ?? ''}</div><div class="r opt" style=${{ color: a.finishVar < 0 ? 'var(--crit)' : 'inherit' }}>${a.type === 'TT_LOE' ? '' : a.finishVar}</div></div>
        <div class="g-time" style=${{ width: W + 'px' }}>
          <div class="g-dd" style=${{ left: X(m.dataDay) + 'px' }}></div>
          ${showBL && b.es != null && !isMs && html`<div class="g-bl" style=${{ left: X(b.es) + 'px', width: Math.max(2, (b.ef - b.es + 1) * px) + 'px' }}></div>`}
          ${isMs ? html`<div class=${'g-ms' + (crit ? ' crit' : '')} style=${{ left: X(c.es) + 'px' }}></div>` : html`<div class=${cls} style=${{ left: X(c.es) + 'px', width: Math.max(3, (c.ef - c.es + 1) * px) + 'px' }}>${a.type === 'TT_Task' && a.pct > 0 && html`<i style=${{ width: Math.min(100, a.pct * 100) + '%' }}></i>`}</div>`}
        </div></div>`;
    })}
    <div class="g-row"><div class="g-left"><div></div><div class="note">Contract completion ${cal.fmt(m.finishBy)}</div></div><div class="g-time" style=${{ width: W + 'px' }}><div class="g-cf" style=${{ left: X(m.finishBy) + 'px' }}></div></div></div>
  </div>`;
}

function ActivityDetail({ m, a, onSel }) {
  if (!a) return null; const cal = m.cal; const items = a.items.map((x) => ({ it: m.itemById.get(x.id), share: x.share })).filter((x) => x.it);
  const relRow = (r, dir) => { const o = m.actByKey.get(dir === 'pred' ? r.from : r.to); return html`<tr key=${r.id + dir} class="clickable" onClick=${() => onSel(o.key)}><td class="mono">${o.code}</td><td>${o.name}</td><td class="mono">${r.type}</td><td class="r">${r.lag}</td><td>${o.status}</td></tr>`; };
  return html`<${Panel} title=${`${a.code} · ${a.name}`} sub=${`${E.stageByNo(a.wbs).name} · ${a.type.replace('TT_', '').replace('FinMile', 'Finish milestone').replace('Mile', 'Start milestone').replace('LOE', 'Level of effort')} · ${a.cls === 'out' ? 'Outdoor calendar (summer midday factor applies)' : 'Standard calendar'}`} actions=${html`<button class="btn sm" onClick=${() => onSel(null)}>Close</button>`}>

function P6Panel({ state, setState, m, toast }) {
  const [table, setTable] = useState('TASK'); const fileRef = useRef(null); const [busy, setBusy] = useState(false); const [res, setRes] = useState(null);
  useEffect(() => warmExports(['jszip', 'xlsx']), []);
  const xer = useMemo(() => E.toXER(m), [m]);
  const preview = useMemo(() => { const lines = xer.split('\r\n'); const i = lines.findIndex((l) => l === `%T\t${table}`); if (i < 0) return ''; const out = []; for (let k = i; k < lines.length && out.length < 40; k++) { if (k > i && lines[k].startsWith('%T')) break; out.push(lines[k].length > 260 ? lines[k].slice(0, 260) + ' …' : lines[k]); } return out.join('\n'); }, [xer, table]);
  const base = `${state.project.code}_P6_${state.project.dataDate}`;
  const exportZip = async () => { setBusy(true); try { await loadScript(LIBS.jszip); const z = new JSZip(); z.file(`${base}.xer`, xer); z.file(`${base}.xml`, E.toP6XML(m)); z.file(`${base}_activities.csv`, E.csvOf(E.activitiesTable(m))); z.file('README.txt', `SiteLedger UAE: Primavera P6 exchange package\nProject: ${state.project.name}\nData date: ${state.project.dataDate}\n\n${base}.xer  Import in P6 Professional (File > Import > XER). Contains PROJECT, CALENDAR (UAE work week + holidays), PROJWBS (16 lifecycle stages), TASK (baseline as target dates, current early/late dates, float, actuals), TASKPRED (FS/SS/FF + lags) and UDFs (BOQ refs, duration basis).\n${base}.xml  P6 XML (APIBusinessObjects) for P6 EPPM or tools that read XML.\n${base}_activities.csv  Flat activity list for Excel.\n\nAfter updating in P6, export an .xer and import it in SiteLedger to sync dates, float and critical path.\nCheck an import in a sandbox P6 database before using it on a live project.\n`); const buf = await z.generateAsync({ type: 'arraybuffer' }); const r = await saveFile(`${base}.zip`, new Blob([buf])); setRes(r); toast(r.msg); } catch (e) { setRes({ ok: false, msg: e.message }); toast(e.message); } finally { setBusy(false); } };
  const exportXlsx = async () => { setBusy(true); try { await loadScript(LIBS.xlsx); const wb = XLSX.utils.book_new(); const at = E.activitiesTable(m); const ws = XLSX.utils.aoa_to_sheet([at.head, ...at.rows]); ws['!cols'] = at.head.map((h, i) => ({ wch: i === 1 ? 52 : i >= 17 ? 30 : 12 })); XLSX.utils.book_append_sheet(wb, ws, 'Activities'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Predecessor', 'Successor', 'Type', 'Lag (WD)'], ...m.curNet.rels.map((r) => [m.actByKey.get(r.from).code, m.actByKey.get(r.to).code, r.type, r.lag])]), 'Relationships'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Norm', 'Unit', 'Output per day', 'Match'], ...state.settings.norms.map((n) => [n.label, n.unit, n.perDay, n.match])]), 'Productivity norms'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Date', 'Holiday'], ...E.UAE_HOLIDAYS]), 'UAE holidays'); const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' }); const r = await saveFile(`${base}.xlsx`, new Blob([out])); setRes(r); toast(r.msg); } catch (e) { setRes({ ok: false, msg: e.message }); toast(e.message); } finally { setBusy(false); } };
  const importXer = async (file) => { if (!file) return; try { const text = await file.text(); const res = E.parseXER(text, m.cal); const codes = new Set(m.acts.map((a) => a.code)); const matched = Object.keys(res.tasks).filter((c) => codes.has(c)); let changed = 0; matched.forEach((c) => { const a = m.acts.find((x) => x.code === c); const t = res.tasks[c]; if (t.es !== a.cur.es || t.ef !== a.cur.ef || t.tf !== a.cur.tf) changed++; }); const tasks = {}; matched.forEach((c) => { tasks[c] = res.tasks[c]; }); setState((s) => ({ ...s, p6Import: { fileName: file.name, at: new Date().toISOString().slice(0, 16).replace('T', ' '), tasks, total: res.count, matched: matched.length, changed, rels: res.rels, project: res.project, dataDate: res.dataDate } })); toast(`P6 import: ${matched.length} of ${res.count} activities matched by Activity ID; ${changed} with changed dates or float.`); } catch (e) { toast(e.message || 'Could not read the .xer file.'); } };
  const imp = state.p6Import;
  return html`<div class="panel-b grid" style=${{ gap: '16px' }}>
    <div class="grid g2">
      <div class="grid" style=${{ gap: '10px', alignContent: 'start' }}>
        <h3 style=${{ fontSize: '15px' }}>Export to Primavera P6</h3>
        <p class="note" style=${{ margin: 0 }}>The .zip holds the native <b>.xer</b> (PROJECT, CALENDAR, PROJWBS, TASK, TASKPRED, UDF tables), a <b>P6 XML</b> file and a CSV activity list. Baseline dates go out as target dates; current dates, float and actuals go out as early/late and actual dates.</p>
        <div class="row"><button class="btn primary" disabled=${busy} onClick=${exportZip}>Export P6 package (.zip: XER + XML + CSV)</button><button class="btn" disabled=${busy} onClick=${exportXlsx}>Export programme (.xlsx)</button></div>
        <${DlStatus} r=${res} />
        <span class="note">${m.acts.length} activities · ${m.curNet.rels.length} relationships · 17 WBS nodes · calendar "${7 - state.settings.cal.offDays.length}-day week, ${state.settings.cal.hoursPerDay} h/day"</span>
      </div>
      <div class="grid" style=${{ gap: '10px', alignContent: 'start' }}>
        <h3 style=${{ fontSize: '15px' }}>Import an updated .xer from P6</h3>
        <p class="note" style=${{ margin: 0 }}>Activities are matched on Activity ID. Imported early/actual dates, total float and the driving path replace the computed values in the current schedule and reports.</p>
        <div class="row"><button class="btn" onClick=${() => fileRef.current.click()}>Choose .xer file</button>${imp && html`<button class="btn ghost" onClick=${() => { setState((s) => ({ ...s, p6Import: null })); toast('P6 import cleared. Using computed CPM dates.'); }}>Clear import</button>`}</div>
        <input ref=${fileRef} id="xer-file" type="file" accept=".xer,.txt" hidden onChange=${(e) => { importXer(e.target.files[0]); e.target.value = ''; }} />
        ${imp ? html`<dl class="kv"><dt>File</dt><dd>${imp.fileName}</dd><dt>Imported</dt><dd>${imp.at}</dd><dt>Activities matched</dt><dd class="num">${imp.matched} of ${imp.total}</dd><dt>Changed dates / float</dt><dd class="num">${imp.changed}</dd><dt>Relationships in file</dt><dd class="num">${imp.rels}</dd></dl>` : html`<span class="note">No P6 import yet. To test the round trip, export the package, then import its .xer here.</span>`}
      </div>
    </div>
    <div><div class="row" style=${{ justifyContent: 'space-between', marginBottom: '6px' }}><h4 class="eyebrow">.xer preview</h4><${Seg} options=${['PROJECT', 'CALENDAR', 'PROJWBS', 'TASK', 'TASKPRED', 'UDFVALUE'].map((t) => [t, t])} value=${table} onChange=${setTable} /></div><div class="code" tabindex="0">${preview}</div></div>
  </div>`;
}

      ${sub === 'nocs' && html`<div class="tw scroll-y"><table class="t"><thead><tr><th>Activity</th><th>Authority</th><th>Permit / NOC</th><th>Triggered by</th><th class="r">SLA</th><th>Need by</th><th>Forecast approval</th><th class="r">TF</th><th>Status</th><th>Reference</th></tr></thead><tbody>
        ${m.docs.nocs.map((n) => html`<tr key=${n.key}><td class="mono">${n.code}</td><td><b>${n.auth}</b></td><td>${n.name} ${n.late && html`<${Chip} tone="crit">Late<//>`}</td><td class="mono">${n.trigger ? 'BOQ ' + n.trigger : 'Template'}</td><td class="r">${n.sla} d</td><td class="mono">${cal.fmt(n.needBy)}</td><td class="mono">${n.status === 'APPROVED' && n.approvedDay != null ? cal.fmt(n.approvedDay) + ' A' : cal.fmt(n.curFinish)}</td><td class="r">${n.tf ?? ''}</td>
          <td><select class="inp sm" id=${'noc-' + n.key} value=${n.status} onChange=${(e) => setNoc(n.key, e.target.value)} style=${{ minWidth: '150px', borderColor: `var(--${statusTone(n.status) === 'good' ? 'good' : statusTone(n.status) === 'warn' ? 'warn' : 'line'})` }}>${E.NOC_STATUSES.map((s) => html`<option key=${s} value=${s}>${E.NOC_LABEL[s]}</option>`)}</select></td><td class="mono">${n.refNo || '—'}</td></tr>`)}

          <input class="inp sm" id="sub-q" placeholder="Search" value=${q} onInput=${(e) => setQ(e.target.value)} style=${{ width: '160px' }} /></div><span class="note">${subs.length} documents. Required date = BOQ item baseline start − review lead (MAR 42 d, SD 28 d, MS/ITP 21 d) − procurement lead for long-lead items.</span></div>
        <div class="tw scroll-y"><table class="t"><thead><tr><th>Doc no.</th><th>Type</th><th>Title</th><th>BOQ</th><th>Stage</th><th>Required by</th><th>Status (consultant code)</th></tr></thead><tbody>
          ${subs.slice(0, 400).map((s) => html`<tr key=${s.id}><td class="mono">${s.id}</td><td>${s.type}</td><td>${s.title} ${s.longLead && html`<${Chip} tone="warn">Long lead<//>`} ${s.overdue && html`<${Chip} tone="crit">Overdue<//>`}</td><td class="mono">${s.itemRef}</td><td>${s.stage}</td><td class="mono">${cal.fmt(s.reqDay)}</td>

  <//>`;

// ───────────────────────── site diary (field app) ─────────────────────────
const TRADES = ['Carpenters', 'Steel fixers', 'Concrete gang', 'Masons', 'Plasterers', 'Tilers', 'Painters', 'Electricians', 'Plumbers', 'Duct fitters', 'Façade installers', 'General labour', 'Engineers & foremen', 'HSE officers & first aiders'];
function DiaryView({ state, setState, m, toast, go }) {
  const latest = m.logs[m.logs.length - 1];
  const blank = () => ({ date: state.project.dataDate, weather: 'Sunny, clear', tempMax: 29, humidity: 55, wind: 14, incidents: 0, nearMiss: 0, tbt: 1, manpower: Object.fromEntries(TRADES.map((t) => [t, latest && latest.manpower[t] ? latest.manpower[t] : 0])), equipment: latest ? { ...latest.equipment } : { 'Tower crane': 1 }, qty: [{ itemId: '', qty: '', loc: '' }], pours: [], insp: [], photos: [], blockers: '' });
  const [f, setF] = useState(blank); const [confirmDel, setConfirmDel] = useState(null);
  const up = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const active = useMemo(() => { const set = new Set(E.lookahead(m, 21).flatMap((x) => x.a.items.map((i) => i.id))); return m.items.filter((i) => !i.c.reserve && !i.c.loe && i.c.stage !== 2 && i.c.stage !== 16).sort((a, b) => (set.has(b.id) ? 1 : 0) - (set.has(a.id) ? 1 : 0)).map((i) => ({ i, active: set.has(i.id) })); }, [m]);
  const valueToday = sum(f.qty, (q) => { const it = m.itemById.get(q.itemId); return it ? Number(q.qty || 0) * it.rate : 0; });
  const addPhotos = async (files) => { const out = []; for (const file of [...files].slice(0, 6)) { try { out.push({ src: await fileToJpeg(file), caption: file.name.replace(/\.[^.]+$/, '') }); } catch (e) { toast(`${file.name} is not an image.`); } } setF((x) => ({ ...x, photos: [...x.photos, ...out] })); };
  const save = () => {
    const qty = f.qty.filter((q) => q.itemId && Number(q.qty) > 0).map((q) => ({ itemId: q.itemId, qty: Number(q.qty), loc: q.loc || 'Site' }));
    if (!qty.length && !f.blockers && !f.photos.length) { toast('Add at least one executed quantity, a photo or a note before saving.'); return; }
    const d = new Date(E.parseISO(f.date));
    const log = { ...f, id: 'u' + Date.now(), user: true, qty, dow: E.DOW[d.getUTCDay()], manpower: Object.fromEntries(Object.entries(f.manpower).filter(([, v]) => Number(v) > 0).map(([k, v]) => [k, Number(v)])), insp: f.insp.filter((x) => x.ref) };
    setState((s) => ({ ...s, userLogs: [...(s.userLogs || []), log] }));
    toast(`Diary for ${fmtDate(E.parseISO(f.date))} saved: AED ${AED(valueToday)} of work. DPR, quantities, EV and the P6 update are recalculated.`);
    setF(blank());
  };
  const byDate = useMemo(() => { const g = new Map(); m.logs.forEach((l) => { if (!g.has(l.date)) g.set(l.date, []); g.get(l.date).push(l); }); return [...g.entries()].sort((a, b) => b[0].localeCompare(a[0])); }, [m.logs]);
  return html`<div class="grid g-main">
    <${Panel} title="Site diary — daily entry" sub="Built for phones on site. Saved quantities flow into the BOQ tracker, EV, the P6 update and the daily, weekly and monthly reports.">
      <div class="grid" style=${{ gap: '16px' }}>
        <div class="diary-grid">
          <label class="field">Date<input type="date" id="d-date" value=${f.date} min=${state.project.startDate} max=${state.project.dataDate} onChange=${(e) => up('date', e.target.value)} /></label>
          <label class="field">Weather<select id="d-weather" value=${f.weather} onChange=${(e) => up('weather', e.target.value)}>${['Sunny, clear', 'Hazy, light dust', 'Humid, fog in morning', 'Windy, sandstorm', 'Rain'].map((w) => html`<option key=${w}>${w}</option>`)}</select></label>
          <label class="field">Max temp °C<input type="number" id="d-temp" value=${f.tempMax} onChange=${(e) => up('tempMax', Number(e.target.value))} /></label>
          <label class="field">Humidity %<input type="number" id="d-hum" value=${f.humidity} onChange=${(e) => up('humidity', Number(e.target.value))} /></label>
          <label class="field">Lost-time injuries<input type="number" id="d-inc" min="0" value=${f.incidents} onChange=${(e) => up('incidents', Number(e.target.value))} /></label>
          <label class="field">Near misses<input type="number" id="d-nm" min="0" value=${f.nearMiss} onChange=${(e) => up('nearMiss', Number(e.target.value))} /></label>
          <label class="field">Toolbox talks<input type="number" id="d-tbt" min="0" value=${f.tbt} onChange=${(e) => up('tbt', Number(e.target.value))} /></label>
          <div class="field">Midday break<span class="note" style=${{ fontWeight: 400 }}>${m.cal.info(m.cal.dayOf(E.parseISO(f.date))).inSummer ? 'Applies today: no outdoor work 12:30–15:00' : 'Not applicable (15 Jun – 15 Sep only)'}</span></div>
        </div>
        <div><h4 class="eyebrow" style=${{ marginBottom: '8px' }}>BOQ quantities executed today</h4>
          <div class="grid" style=${{ gap: '8px' }}>${f.qty.map((q, k) => { const it = m.itemById.get(q.itemId); const done = it ? m.execQtyAt(it, m.dataDay) : 0; const over = it && Number(q.qty) + done > it.qty * 1.001; return html`<div key=${k}><div class="qrow">
            <label class="field">BOQ item<select id=${'q-item-' + k} value=${q.itemId} onChange=${(e) => up('qty', f.qty.map((x, j) => (j === k ? { ...x, itemId: e.target.value } : x)))}><option value="">Select an item…</option><optgroup label="In the 3-week lookahead">${active.filter((x) => x.active).map(({ i }) => html`<option key=${i.id} value=${i.id}>${i.ref} · ${i.desc.slice(0, 60)}</option>`)}</optgroup><optgroup label="All other items">${active.filter((x) => !x.active).map(({ i }) => html`<option key=${i.id} value=${i.id}>${i.ref} · ${i.desc.slice(0, 60)}</option>`)}</optgroup></select></label>
            <label class="field">Qty ${it ? `(${it.unit})` : ''}<input type="number" id=${'q-qty-' + k} step="any" min="0" inputmode="decimal" value=${q.qty} onChange=${(e) => up('qty', f.qty.map((x, j) => (j === k ? { ...x, qty: e.target.value } : x)))} /></label>
            <label class="field loc">Location<input id=${'q-loc-' + k} placeholder="e.g. L4 Zone B" value=${q.loc} onChange=${(e) => up('qty', f.qty.map((x, j) => (j === k ? { ...x, loc: e.target.value } : x)))} /></label>
            <button class="btn sm" aria-label="Remove row" onClick=${() => up('qty', f.qty.filter((_, j) => j !== k))}>✕</button></div>
            ${it && html`<div class=${over ? 'warnline' : 'note'}>${over ? `Exceeds BOQ quantity by ${AED(Number(q.qty) + done - it.qty, 2)} ${it.unit}. Raise a re-measurement or a VO.` : `Executed to date ${AED(done, 2)} of ${AED(it.qty, 2)} ${it.unit} · today's value AED ${AED(Number(q.qty || 0) * it.rate)}`}</div>`}</div>`; })}
          <div class="row"><button class="btn sm" onClick=${() => up('qty', [...f.qty, { itemId: '', qty: '', loc: '' }])}>+ Add quantity</button><span class="note">Value today: <b class="num">AED ${AED(valueToday)}</b></span></div></div>
        </div>
        <details><summary class="eyebrow" style=${{ cursor: 'pointer' }}>Manpower by trade (${sum(Object.values(f.manpower), Number)} on site)</summary>
          <div class="diary-grid" style=${{ marginTop: '8px' }}>${TRADES.map((t, k) => html`<label class="field" key=${t}>${t}<input type="number" id=${'mp-' + k} min="0" inputmode="numeric" value=${f.manpower[t] || 0} onChange=${(e) => up('manpower', { ...f.manpower, [t]: Number(e.target.value) })} /></label>`)}</div></details>
        <details><summary class="eyebrow" style=${{ cursor: 'pointer' }}>Equipment (${Object.keys(f.equipment).length} types)</summary>
          <div class="diary-grid" style=${{ marginTop: '8px' }}>${Object.entries(f.equipment).map(([k, v], i) => html`<label class="field" key=${k}>${k}<input type="number" id=${'eq-' + i} min="0" value=${v} onChange=${(e) => up('equipment', { ...f.equipment, [k]: Number(e.target.value) })} /></label>`)}</div></details>
